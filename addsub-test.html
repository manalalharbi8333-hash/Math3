<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مهمة الجمع والطرح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: a treasure-map journey — one bold station per screen, a station track on top, big tap targets */
:root{
  --sea:#0d4a5a; --sea-2:#0a3a47; --sun:#ffc531; --coral:#ff6a3d; --mint:#22c3a6;
  --paper:#fff6e0; --card:#ffffff; --ink:#1d2a33; --muted:#5d6b73; --line:#f0dfb4;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:700;font-size:20px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;min-height:100vh;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,197,49,.25) 0 90px,transparent 91px),radial-gradient(circle at 92% 70%,rgba(34,195,166,.18) 0 120px,transparent 121px)}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto}
button{font-family:var(--body);font-weight:800;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--coral);outline-offset:3px}

/* header band */
.top{background:var(--sea);color:#fff;border-radius:0 0 28px 28px;padding:14px 22px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,197,49,.14)}
.school{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:#cfe7ec;flex-wrap:wrap}
.school img{height:46px;background:#fff;border-radius:10px;padding:3px 6px}
.ttl{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,52px);line-height:1.15;margin:8px 0 2px;color:var(--sun);text-wrap:balance;letter-spacing:0}
.sub{font-size:clamp(16px,2.6vw,20px);color:#fff;margin:0}

/* station track */
.track{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px;position:relative;z-index:1}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:15px;display:grid;place-items:center;padding:0;font-family:var(--body)}
.dot.done{background:var(--mint);border-color:var(--mint)}
.dot.cur{background:var(--sun);border-color:#fff;color:var(--sea);transform:scale(1.18)}
.bar{height:14px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:12px;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .4s}
.barlbl{display:flex;justify-content:space-between;font-size:15px;color:#cfe7ec;margin-top:6px;position:relative;z-index:1}

/* cards */
.card{background:var(--card);border:4px solid var(--sea);border-radius:26px;padding:26px clamp(16px,4vw,38px);box-shadow:0 10px 0 var(--sea-2)}
.tag{display:inline-flex;gap:8px;align-items:center;background:var(--coral);color:#fff;border-radius:99px;padding:4px 16px;font-size:17px;font-weight:900}
.tag.alt{background:var(--sea)}
.q{font-size:clamp(23px,3.6vw,30px);font-weight:900;line-height:1.6;margin:16px 0 18px;text-wrap:pretty}
.hint{color:var(--muted);font-size:17px;margin:-6px 0 14px}

/* equations (RTL token order) */
.eq{display:flex;direction:rtl;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:clamp(30px,6vw,44px);font-weight:900;color:var(--sea);margin:10px 0 22px;font-variant-numeric:tabular-nums}
.eq span{direction:rtl;unicode-bidi:isolate}
.eq .op{color:var(--coral)}
.box{display:inline-block;width:1.4em;height:1.25em;border:4px dashed var(--coral);border-radius:12px;background:#fff3ec;vertical-align:middle}
.eq input{width:2.6em;height:1.4em;font:inherit;font-size:.85em;text-align:center;border:4px solid var(--coral);border-radius:14px;background:#fff3ec;color:var(--ink)}

/* mcq */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:14px;background:#fffaf0;border:4px solid var(--line);border-radius:20px;padding:14px 18px;font-size:clamp(22px,3.6vw,30px);text-align:right;color:var(--ink);min-height:78px;transition:transform .12s,border-color .12s,background .12s}
.opt:hover{transform:translateY(-2px);border-color:var(--sun)}
.opt .l{flex:none;width:46px;height:46px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-size:22px}
.opt .v{min-width:0}
.opt.sel{background:#fff1c4;border-color:var(--sun);box-shadow:inset 0 0 0 3px var(--sun)}
.opt.sel .l{background:var(--coral)}
.opt .eq{margin:0;font-size:inherit;justify-content:flex-start;color:var(--ink)}

/* vertical sum */
.vert{direction:ltr;display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:22px;font-size:clamp(40px,8vw,60px);font-weight:900;color:var(--sea);font-variant-numeric:tabular-nums;line-height:1.25;margin:4px 0 8px}
.vert .n{text-align:right;letter-spacing:.12em}
.vert .s{color:var(--coral)}
.vert hr{grid-column:1/-1;border:0;border-top:6px solid var(--sea);width:100%;margin:6px 0 10px}
.vert input{grid-column:1/-1;justify-self:end;width:5.4ch;font:inherit;text-align:right;letter-spacing:.08em;border:4px solid var(--coral);border-radius:16px;background:#fff3ec;color:var(--ink);padding:0 8px}

/* number answer */
.ansrow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:26px}
.ansrow input{width:7ch;font:inherit;font-size:34px;text-align:center;border:4px solid var(--coral);border-radius:16px;background:#fff3ec;color:var(--ink);padding:4px}
.pic{display:block;margin:0 auto 18px;border-radius:18px;border:3px solid var(--line);width:100%;max-width:760px}

/* property select */
.props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.prop{background:#eefaf7;border:4px solid #c9eee6;border-radius:18px;padding:12px;font-size:20px;color:var(--ink);min-height:70px}
.prop.sel{background:var(--mint);border-color:var(--sea);color:#fff}
.lbl{font-size:19px;color:var(--muted);margin:14px 0 4px;text-align:center}

/* nav */
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:26px;flex-wrap:wrap}
.btn{border:0;border-radius:18px;padding:14px 28px;font-size:22px;background:var(--sun);color:var(--sea);box-shadow:0 6px 0 #d49c00;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d49c00}
.btn.ghost{background:#fff;color:var(--sea);box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}
.btn.go{background:var(--coral);color:#fff;box-shadow:0 6px 0 #c24822}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cheer{text-align:center;color:var(--mint);font-size:19px;min-height:1.7em;margin-top:12px}

/* intro */
.hero{text-align:center}
.hero .big{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,50px);color:var(--sea);margin:4px 0;line-height:1.2}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0;text-align:center}
.rule{background:#fffaf0;border:3px solid var(--line);border-radius:18px;padding:14px 10px;font-size:18px}
.rule b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--coral);line-height:1.3}
.field{display:grid;gap:6px;margin:12px 0;text-align:right}
.field input,.field select{font:inherit;font-size:22px;padding:12px 16px;border:4px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);width:100%}
.err{color:#c62d0a;font-size:18px;min-height:1.6em}

/* countdown */
.clock{display:flex;justify-content:center;gap:10px;direction:rtl;margin:14px 0}
.clock div{background:var(--sea);color:var(--sun);border-radius:16px;padding:8px 14px;min-width:84px;text-align:center}
.clock b{display:block;font-family:var(--display);font-weight:400;font-size:38px;line-height:1.2;font-variant-numeric:tabular-nums}
.clock small{color:#cfe7ec;font-size:15px}

/* review grid */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:16px 0}
.rgrid button{border:4px solid var(--mint);background:#eefaf7;border-radius:16px;padding:10px 0;font-size:20px;color:var(--sea)}
.rgrid button.empty{border-color:var(--coral);background:#fff0ea;color:#c24822}
.confirm{background:#fff1c4;border:3px solid var(--sun);border-radius:18px;padding:16px;margin-top:14px;text-align:center}

.score{font-family:var(--display);font-weight:400;font-size:clamp(70px,16vw,120px);color:var(--coral);line-height:1;margin:8px 0}
.stars{font-size:46px;letter-spacing:6px;color:var(--sun)}
.foot{text-align:center;color:var(--muted);font-size:15px;margin-top:28px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:640px){
  body{font-size:18px}
  .opts{grid-template-columns:1fr}
  .props,.rules{grid-template-columns:1fr}
  .dot{width:28px;height:28px;font-size:13px}
  .clock div{min-width:66px;padding:6px 8px}
  .clock b{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>

const CHEERS = ["تقدّم رائع في الرحلة! 🚀","محطة جديدة تنتظرك! 🗺️","أنت تقترب من الكنز! 💎","استمر يا بطل، ركّز جيدًا! ⭐","خطوة بخطوة نحو القمة! 🏔️","ثقتك بنفسك سر نجاحك! 💪"];
const AR = "٠١٢٣٤٥٦٧٨٩";
const toAr = n => String(n).replace(/\d/g,d=>AR[d]);
const norm = s => String(s??"").trim().replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^\d]/g,"");
const deadline = new Date(CONFIG.DEADLINE).getTime();
const isOver = () => Date.now() >= deadline;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ الحالة ============ */
let S = load() || {name:"",cls:"",answers:{},order:{},idx:0,submitted:false};
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureOrder(){ITEMS.forEach(it=>{if(it.t==="mcq"&&!S.order[it.k])S.order[it.k]=shuffle(Object.keys(it.o));if(it.t==="prop"&&!S.order[it.k])S.order[it.k]=shuffle([0,1,2]);});save();}

const app = document.getElementById("app");
const eqHTML = (tokens, inputKey, val) => `<div class="eq">${tokens.map(t=>{
  if(t==="□") return inputKey?`<span><input id="in_${inputKey}" inputmode="numeric" autocomplete="off" aria-label="العدد المناسب" value="${esc(val??"")}"></span>`:`<span class="box" aria-label="مربع فارغ"></span>`;
  const cls = /[+=−()]/.test(t)?"op":"";
  return `<span class="${cls}">${t}</span>`;}).join("")}</div>`;

function answered(it){const v=S.answers[it.k];if(it.t==="prop")return v&&norm(v.n)!==""&&v.p!==undefined&&v.p!==null;return v!==undefined&&v!==null&&String(v).trim()!==""}

/* ============ الشاشات ============ */
function route(){
  document.getElementById("trackWrap").hidden = true;
  if(S.submitted && isOver()) return renderResult();
  if(S.submitted) return renderWaiting();
  if(isOver()) return renderClosed();
  if(!S.name) return renderIntro();
  if(S.idx>=ITEMS.length) return renderReview();
  renderQ();
}

function clockHTML(){return `<div class="clock" id="clock" aria-live="off"></div>`}
function tickClock(){
  const el=document.getElementById("clock"); if(!el) return;
  let ms=Math.max(0,deadline-Date.now());
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000);
  el.innerHTML=`<div><b>${toAr(String(h).padStart(2,"0"))}</b><small>ساعة</small></div><div><b>${toAr(String(m).padStart(2,"0"))}</b><small>دقيقة</small></div><div><b>${toAr(String(s).padStart(2,"0"))}</b><small>ثانية</small></div>`;
  if(ms<=0 && (S.submitted||!S.name)) { route(); }
}
setInterval(tickClock,1000);

function renderIntro(){
  app.innerHTML = `<section class="card hero pop">
    <span class="tag">🏴‍☠️ مهمة جديدة</span>
    <p class="big">هل أنت مستعد لاكتشاف الكنز؟</p>
    <p>تنتظرك <b>${toAr(ITEMS.length)}</b> محطة في رحلة الجمع والطرح. حلّ كل محطة بتركيز لتصل إلى الكنز!</p>
    <div class="rules">
      <div class="rule"><b>${toAr(ITEMS.length)}</b>محطة تنتظرك</div>
      <div class="rule"><b>١</b>محاولة واحدة فقط</div>
      <div class="rule"><b>${toAr(CONFIG.TOTAL)}</b>درجة الاختبار</div>
    </div>
    <p class="hint">تظهر نتيجتك بعد انتهاء وقت الاختبار، يبقى على انتهائه:</p>
    ${clockHTML()}
    <div class="field"><label for="nm">اسم الطالب/ة الثلاثي</label><input id="nm" autocomplete="off" value="${esc(S.name)}" placeholder="اكتب اسمك هنا"></div>
    <div class="field"><label for="cl">الفصل</label><select id="cl"><option value="">اختر فصلك</option>${CONFIG.CLASSES.map(c=>`<option ${S.cls===c?"selected":""}>${c}</option>`).join("")}</select></div>
    <div class="err" id="err"></div>
    <button class="btn go" id="start">ابدأ الرحلة 🚀</button>
  </section>`;
  tickClock();
  document.getElementById("start").onclick=()=>{
    const n=document.getElementById("nm").value.trim().replace(/\s+/g," "), c=document.getElementById("cl").value;
    if(n.split(" ").length<2){document.getElementById("err").textContent="اكتب اسمك (الاسم الأول واسم الأب على الأقل).";return}
    if(!c){document.getElementById("err").textContent="اختر فصلك من القائمة.";return}
    S.name=n;S.cls=c;S.idx=0;S.startedAt=new Date().toISOString();ensureOrder();save();route();
  };
}

function drawTrack(){
  const tw=document.getElementById("trackWrap"); tw.hidden=false;
  document.getElementById("track").innerHTML = ITEMS.map((it,i)=>`<button class="dot ${i===S.idx?"cur":answered(it)?"done":""}" data-i="${i}" aria-label="المحطة ${toAr(i+1)}">${toAr(i+1)}</button>`).join("");
  document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{collect();S.idx=+b.dataset.i;save();route();});
  const n=ITEMS.filter(answered).length;
  document.getElementById("barFill").style.width=(n/ITEMS.length*100)+"%";
  document.getElementById("barTxt").textContent=`أنجزت ${toAr(n)} من ${toAr(ITEMS.length)} محطة`;
  document.getElementById("who").textContent=`${S.name} · ${S.cls}`;
}

function cheer(){const c=document.getElementById("cheer");if(c)c.textContent=CHEERS[Math.floor(Math.random()*CHEERS.length)];}
function collect(){
  const it=ITEMS[S.idx]; if(!it) return;
  const inp=document.getElementById("in_"+it.k); if(!inp) return;
  if(it.t==="prop"){const pv=S.answers[it.k]||{};pv.n=inp.value;S.answers[it.k]=pv;} else S.answers[it.k]=inp.value;
  save();
}

  app.querySelectorAll(".rgrid button").forEach(b=>b.onclick=()=>{S.idx=+b.dataset.i;save();route();});

    document.getElementById("yes").onclick=submit;
  };
}

/* ============ التصحيح (مخفي حتى انتهاء الوقت) ============ */
function grade(){
  let total=0, part1=0, part2=0; const cells={};
  ITEMS.forEach(it=>{
    const v=S.answers[it.k]; let pts=0, shown="";
    if(it.t==="mcq"){ shown=v||"—"; if(v===it.a) pts=it.pts; }
    else if(it.t==="prop"){ const n=v?norm(v.n):"", p=v&&v.p!=null?P[v.p]:"—";
      if(n!==""&&+n===it.a) pts+=0.5; if(v&&v.p===it.ap) pts+=0.5; shown=`${n===""?"—":n} / ${p}`; }
    else { const n=norm(v); shown=n===""?"—":n; if(n!==""&&+n===it.a) pts=it.pts; }
    total+=pts; if(it.k.startsWith("q1"))part1+=pts; else part2+=pts;
    cells[it.lbl]=`${pts===it.pts?"✓":pts>0?"½":"✗"} ${shown}`;
  });
  return {total,part1,part2,cells};
}

async function submit(){
  const g=grade();
  S.submitted=true; S.submittedAt=new Date().toISOString(); S.score=g.total;
  S.id = S.id || ("T"+Date.now().toString(36).toUpperCase());
  save();
  const order=["س١-١","س١-٢","س١-٣","س١-٤","س١-٥","س١-٦","س١-٧","س١-٨","س١-٩","س١-١٠","س٢-١ (أ)","س٢-١ (ب)","س٢-١ (ج)","س٢-٢ (أ)","س٢-٢ (ب)","س٢-٣ (أ)","س٢-٣ (ب)","س٢-٤","س٢-٥"];
  S.payload={id:S.id,name:S.name,cls:S.cls,score:g.total,part1:g.part1,part2:g.part2,startedAt:S.startedAt,submittedAt:S.submittedAt,items:order.map(l=>g.cells[l])};
  S.sent=false; save();
  confetti();
  renderWaiting();
  sendPayload();
}
async function sendPayload(){
  if(!CONFIG.SCRIPT_URL||!S.payload){ return; }
  try{
    await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(S.payload)});
    S.sent=true; save();
  }catch(e){ S.sent=false; save(); }
  const st=document.getElementById("sendState"); if(st) st.innerHTML=sendStateHTML();
  const r=document.getElementById("resend"); if(r) r.onclick=()=>{st.textContent="جارٍ الإرسال…";sendPayload();};
}
function sendStateHTML(){
  if(!CONFIG.SCRIPT_URL) return "";
  return S.sent?`<p style="color:var(--mint)">✔ وصلت إجاباتك إلى معلمتك.</p>`:`<p style="color:#c24822">لم تصل إجاباتك بعد. تأكد من اتصالك بالإنترنت ثم اضغط:</p><button class="btn" id="resend">إعادة الإرسال</button>`;
}

function renderWaiting(){
  app.innerHTML=`<section class="card hero pop">
    <span class="tag alt">💎 وصلت إلى الكنز</span>
    <p class="big">أحسنت يا ${esc(S.name.split(" ")[0])}! أنهيت الرحلة</p>
    <p>تم تسليم اختبارك. ستظهر نتيجتك هنا بعد انتهاء وقت الاختبار، عُد إلى هذا الرابط بعد:</p>
    ${clockHTML()}
    <div id="sendState">${CONFIG.SCRIPT_URL?(S.sent?sendStateHTML():"<p>جارٍ إرسال إجاباتك…</p>"):""}</div>
  </section>`;
  tickClock();
  if(CONFIG.SCRIPT_URL && !S.sent && S.payload && !renderWaiting.busy){renderWaiting.busy=true;sendPayload().finally(()=>renderWaiting.busy=false);}
}

function band(sc){const r=sc/CONFIG.TOTAL;
  if(r>=0.9) return ["⭐⭐⭐⭐⭐","بطل الحساب! أداء متميز، واصل تألقك."];
  if(r>=0.75) return ["⭐⭐⭐⭐","أداء رائع! أنت قريب جدًا من القمة."];
  if(r>=0.5) return ["⭐⭐⭐","جهد جميل! بالتدريب ستصل إلى القمة."];
  return ["⭐⭐","بداية الرحلة! سنتدرب معًا وستتفوق بإذن الله."];}

function renderResult(){
  const sc=S.score??0, [st,msg]=band(sc);
  app.innerHTML=`<section class="card hero pop">
    <span class="tag">🏆 نتيجتك</span>
    <p class="big">${esc(S.name)}</p>
    <p>${esc(S.cls)}</p>
    <div class="score">${toAr(String(sc).replace(".5","٫٥").replace(/\d/g,d=>d))} <span style="font-size:.4em;color:var(--sea)">/ ${toAr(CONFIG.TOTAL)}</span></div>
    <div class="stars">${st}</div>
    <p class="q" style="margin-top:6px">${msg}</p>
  </section>`;
  if(sc/CONFIG.TOTAL>=0.75) confetti();
}

function renderClosed(){
  app.innerHTML=`<section class="card hero pop">
    <span class="tag alt">⏰ انتهى وقت الاختبار</span>
    <p class="big">انتهت مدة الاختبار الإلكتروني</p>
    <p>إذا كنت قد اختبرت من جهاز آخر، اكتب اسمك وفصلك كما كتبتهما لمعرفة نتيجتك.</p>
    <div class="field"><label for="nm2">الاسم</label><input id="nm2" autocomplete="off"></div>
    <div class="field"><label for="cl2">الفصل</label><select id="cl2"><option value="">اختر فصلك</option>${CONFIG.CLASSES.map(c=>`<option>${c}</option>`).join("")}</select></div>
    <div class="err" id="err2"></div>
    <button class="btn go" id="look">اعرض نتيجتي</button>
  </section>`;
  document.getElementById("look").onclick=async()=>{
    const e=document.getElementById("err2"); const n=document.getElementById("nm2").value.trim(), c=document.getElementById("cl2").value;
    if(!n||!c){e.textContent="اكتب الاسم واختر الفصل.";return}
    if(!CONFIG.SCRIPT_URL){e.textContent="لم يتم العثور على نتيجة على هذا الجهاز.";return}
    e.textContent="جارٍ البحث…";
    try{
      const r=await fetch(CONFIG.SCRIPT_URL+"?action=result&name="+encodeURIComponent(n)+"&cls="+encodeURIComponent(c));
      const d=await r.json();
      if(d.found){S={...S,name:d.name,cls:d.cls,score:d.score,submitted:true};renderResult();}
      else e.textContent=d.locked?"لم ينتهِ وقت الاختبار بعد.":"لم نجد نتيجة بهذا الاسم. تأكد من كتابة الاسم كما كتبته في الاختبار.";
    }catch(err){e.textContent="تعذّر الاتصال. تأكد من الإنترنت وحاول مرة أخرى.";}
  };
}

/* ============ احتفال ============ */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("fx"),cx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffc531","#ff6a3d","#22c3a6","#0d4a5a","#ffffff"];
  const ps=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));
  let t=0;(function f(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);cx.restore();});if(++t<220)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height);})();
}

route();
</script>
